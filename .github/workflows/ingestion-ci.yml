name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Start disposable Mongo replica set
        run: |
          docker run -d --name kirana-test-mongo -p 27017:27017 mongo:8.0.38 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec kirana-test-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1})'; then break; fi
            sleep 1
          done
          docker exec kirana-test-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec kirana-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 1
          done
      - run: python -m pytest -q
        env:
          KIRANA_TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
